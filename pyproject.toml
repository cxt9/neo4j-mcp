[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "neo4j-mcp"
version = "0.2.0"
description = "Model Context Protocol (MCP) server and client for Neo4j database access"
readme = "readme.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Neo4j MCP", email = "neo4j-mcp@example.com" },
]
keywords = [
    "mcp",
    "neo4j",
    "model-context-protocol",
    "llm",
    "graph-database",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mcp>=1.2.0",
    "neo4j>=5.15.0,<6.0.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
    "types-requests",
]

[project.urls]
Homepage = "https://github.com/neo4j-mcp/neo4j-mcp"
Repository = "https://github.com/neo4j-mcp/neo4j-mcp"
Documentation = "https://github.com/neo4j-mcp/neo4j-mcp#readme"

[project.scripts]
neo4j-mcp-server = "neo4j_mcp.server:main"
neo4j-mcp-client = "neo4j_mcp.client:main"

[tool.hatch.build.targets.wheel]
packages = ["src/neo4j_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "examples/",
    "tests/",
    "README.md",
    "LICENSE",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501", "B008", "C901"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short" 